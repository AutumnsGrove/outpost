name: web

# The built frontend is not committed (PLAN 38). The image build runs `pnpm
# build` from web/src and copies the bundle into the Go binary, so there is no
# copy in git to keep in sync and nothing here needs to diff one.
#
# What is still worth checking is the property the old committed-build job was
# quietly relying on: two builds of one tree produce one result. `version.name`
# in web/vite.config.ts is a hash of `web/src` rather than SvelteKit's default
# `Date.now()`, which is what makes the client's cache-invalidation token mean
# anything and what keeps image builds reproducible. Before that change, every
# build minted new chunk names.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # corepack reads `packageManager` from web/package.json, so the runner uses
      # the pnpm the lockfile was written with rather than whatever is newest.
      - name: Enable pnpm
        run: corepack enable
      - name: Restore the pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: web-deps-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: |
            web-deps-${{ runner.os }}-
      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Build twice and compare
        working-directory: web
        run: |
          set -eu
          pnpm build
          cp -R build "${RUNNER_TEMP}/build-first"
          pnpm build
          if ! diff -r "${RUNNER_TEMP}/build-first" build; then
            echo
            echo "Two builds of the same tree produced different output. Something in the build reads a clock, a random value or an unsorted directory."
            exit 1
          fi
