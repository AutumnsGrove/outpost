name: web

# The built frontend is committed on purpose: the Go binary embeds `web/build`
# with go:embed, the Le Potato needs no Node, and `git pull && go build` is the
# whole deploy. That only holds if the committed bundle is what the sources
# produce, so this job rebuilds it and fails on any difference.
#
# It only works because the build is reproducible: `version.name` in
# web/vite.config.ts is a hash of `web/src`, not the `Date.now()` SvelteKit
# defaults to. Before that, every `make web` minted new chunk names and this job
# could not exist.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  committed-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # corepack reads `packageManager` from web/package.json, so the runner uses
      # the pnpm the lockfile was written with rather than whatever is newest.
      - name: Enable pnpm
        run: corepack enable
      - name: Restore the pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: web-deps-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: |
            web-deps-${{ runner.os }}-
      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Rebuild the bundle
        run: make web
      - name: The committed bundle must match the sources
        run: |
          # `git status`, not `git diff`: a diff ignores untracked files, so a
          # rebuild that only *adds* output — a new file in web/static/ lands in
          # web/build as untracked — would sail through the check while the
          # committed bundle lacks it.
          if [ -n "$(git status --porcelain -- web/build)" ]; then
            git status --porcelain -- web/build
            echo
            echo "web/build is out of date. Run \`make web\` and commit web/build with the source change."
            exit 1
          fi

  # The same property, from the other direction: two builds of one tree have to
  # produce one result. This is what the diff check above quietly depends on, and
  # it is the thing that broke before (every build minted new filenames).
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm
        run: corepack enable
      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Build twice and compare
        working-directory: web
        run: |
          set -eu
          pnpm build
          cp -R build "${RUNNER_TEMP}/build-first"
          pnpm build
          if ! diff -r "${RUNNER_TEMP}/build-first" build; then
            echo
            echo "Two builds of the same tree produced different output. Something in the build reads a clock, a random value or an unsorted directory."
            exit 1
          fi
