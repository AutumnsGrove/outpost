# Pinned to the pack: Minecraft 1.20.1 on Fabric. The loader is the newest 0.15
# because the pack ships 0.15.7 and anything in this file has to load on 0.15.x;
# fabric.mod.json declares ">=0.15.0" so a newer server still takes it.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
loader_version=0.15.11
# 0.92.2 is the last Fabric API for 1.20.1 whose floor is loader 0.15.6. The
# deployed launcher pins 0.20.1 (read out of fabric-server-launcher.properties
# in mc-assets on 2026-11-14), so anything up to 0.92.12 would load today — but
# 0.92.4+ requires loader 0.16.10, and a pin that only works on a loader we did
# not choose is a pin that breaks the day the launcher is republished. The only
# thing used here is CommandRegistrationCallback, unchanged across the 0.9x line.
fabric_version=0.92.2+1.20.1

mod_version=1.0.0
maven_group=io.github.autumnsgrove
archives_base_name=outpost
