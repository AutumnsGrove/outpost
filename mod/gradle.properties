# Pinned to the pack: Minecraft 1.20.1 on Fabric. The loader is the newest 0.15
# because the pack ships 0.15.7 and anything in this file has to load on 0.15.x;
# fabric.mod.json declares ">=0.15.0" so a newer server still takes it.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
loader_version=0.15.11
# 0.92.2 is the last Fabric API for 1.20.1 that still accepts loader 0.15.x,
# and the pack runs 0.15.7. 0.92.4+ requires 0.16.10, so pinning the newest one
# would build a jar that cannot start on the server it is for (found the hard
# way: `runServer` refused to load it). The only thing used here is
# CommandRegistrationCallback, which has not changed across the whole 0.9x line.
fabric_version=0.92.2+1.20.1

mod_version=1.0.0
maven_group=io.github.autumnsgrove
archives_base_name=outpost
