# Outpost configuration.
#
# Secrets are NOT here. They come from the environment:
#   HETZNER_TOKEN, CF_TOKEN, TS_AUTHKEY, R2_ACCESS_KEY, R2_SECRET_KEY,
#   OUTPOST_TOKEN (optional, bearer token for the HTTP API)
#
# Copy to config.yaml and edit.

listen: "127.0.0.1:8896"   # bound to loopback; publish with `tailscale serve`
database: "outpost.db"

server:
  asset_bucket: "mc-assets"   # mods, fabric jar, server.properties, scripts
  world_bucket: "mc-worlds"   # current/world.tar.gz + timestamped backups
  mc_port: 25565

  # Total time billed after the last player logs off is idle_grace + idle_timeout.
  idle_grace: "10m"           # empty -> IDLE
  idle_timeout: "20m"         # IDLE -> TERMINATING
  provision_timeout: "15m"    # give up on a VPS that never answers RCON
  tick_interval: "20s"
  rcon_failure_limit: 15      # consecutive failed probes before a live server
                              #   is assumed wedged and taken down. 15 x 20s = 5
                              #   minutes: enough for a tailnet reconnect.

# Every key here is a valid `outpost start <region>` argument.
#
# `server_type` decides the price far more than the provider does. Hetzner
# renamed and repriced its plans in June 2026: CX22 is gone, and these are the
# current numbers from the API (net, EUR, Nuremberg, 2026-11-12):
#
#   cx23   2c / 4 GB   €0.0104/h   ~€0.021 per 2 h session   ← default
#   cx33   4c / 8 GB   €0.0160/h   ~€0.032 per session, room for a modpack
#   cax11  2c / 4 GB   €0.0112/h   ARM
#   cax21  4c / 8 GB   €0.0200/h   ARM
#
# Ashburn is no longer worth listing: its cheapest 4-8 GB plan is cpx21 at
# €0.0601/h, six times Nuremberg. Swapping size is a one-line edit here; the
# region key is just the argument to `outpost start <key>`.
#
# `hourly_rate` is a display estimate for `outpost status`, in EUR because that
# is what Hetzner bills. It is never used to bill anything.
regions:
  eu:
    location: nbg1            # Nuremberg
    server_type: cx23         # 2 vCPU, 4 GB
    hourly_rate: 0.0104       #   the rate of the type you expect to get
    # Tried in order when server_type has no capacity. Hetzner answers a
    # sold-out plan with 412 resource_unavailable rather than queueing, so
    # without this one missing size means no session at all.
    fallback_types:
      - cx33                  # 4 vCPU, 8 GB, EUR 0.0160/hr
      - cax11                 # 2 vCPU, 4 GB, ARM, EUR 0.0112/hr

cloudflare:
  zone_id: "your-zone-id"
  record_name: "mc.example.com"   # DNS-only A record, updated on start

hetzner:
  image: "ubuntu-24.04"
  ssh_key_id: 12345               # from the Hetzner console
  ssh_private_key: "~/.ssh/outpost"
  ssh_user: "root"
  server_name_base: "outpost"     # also the tailnet hostname prefix
  # firewall_id: 67890            # optional: an existing Hetzner Cloud Firewall,
                                  #   applied at create time. ufw in cloud-init
                                  #   is the floor; this is the belt.
  # snapshot_id: 67890            # optional: restore from a prepped snapshot
                                  # instead of building from R2 every time

tailscale:
  # Tags are opt-in. Leave this empty and the VPS joins as an ordinary device,
  # which always works. Set it only once `tag:outpost` exists in your tailnet's
  # ACLs with an owner — otherwise `tailscale up` refuses the join with
  # "requested tags are invalid or not permitted" and the VPS is unreachable.
  # tags:
  #   - "tag:outpost"

r2:
  account_id: "your-account-id"
