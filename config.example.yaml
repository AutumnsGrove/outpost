# Outpost configuration.
#
# Secrets are NOT here. They come from the environment:
#   HETZNER_TOKEN, CF_TOKEN, TS_AUTHKEY, R2_ACCESS_KEY, R2_SECRET_KEY,
#   OUTPOST_TOKEN (optional, bearer token for the HTTP API)
#
# Copy to config.yaml and edit.

listen: "127.0.0.1:8896"   # bound to loopback; publish with `tailscale serve`
database: "outpost.db"

server:
  asset_bucket: "mc-assets"   # mods, fabric jar, server.properties, scripts
  world_bucket: "mc-worlds"   # current/world.tar.gz + timestamped backups
  mc_port: 25565

  # Total time billed after the last player logs off is idle_grace + idle_timeout.
  idle_grace: "10m"           # empty -> IDLE
  idle_timeout: "20m"         # IDLE -> TERMINATING
  provision_timeout: "15m"    # give up on a VPS that never answers RCON
  tick_interval: "20s"
  rcon_failure_limit: 15      # consecutive failed probes before a live server
                              #   is assumed wedged and taken down. 15 x 20s = 5
                              #   minutes: enough for a tailnet reconnect.

# Every key here is a valid `outpost start <region>` argument.
#
# `server_type` decides the price far more than the provider does: a 4 GB plan is
# roughly a third of the cost of an 8 GB one per session. Hetzner renamed and
# repriced its plans in June 2026 (CX22 is the current 4 GB), and stock has been
# thin since — check the console for what is actually orderable.
#
# `hourly_rate` is a display estimate for `outpost status`. It is never used to
# bill anything. Correct it from an invoice, not from a blog post.
regions:
  eu:
    location: nbg1            # Nuremberg
    server_type: cx22         # 2 vCPU, 4 GB — step to cax21 (ARM, 8 GB) if the
    hourly_rate: 0.0063       #   modpack needs the headroom; ~half price
  us:
    location: ash             # Ashburn
    server_type: cx22
    hourly_rate: 0.0063

cloudflare:
  zone_id: "your-zone-id"
  record_name: "mc.example.com"   # DNS-only A record, updated on start

hetzner:
  image: "ubuntu-24.04"
  ssh_key_id: 12345               # from the Hetzner console
  ssh_private_key: "~/.ssh/outpost"
  ssh_user: "root"
  server_name_base: "outpost"     # also the tailnet hostname prefix
  # firewall_id: 67890            # optional: an existing Hetzner Cloud Firewall,
                                  #   applied at create time. ufw in cloud-init
                                  #   is the floor; this is the belt.
  # snapshot_id: 67890            # optional: restore from a prepped snapshot
                                  # instead of building from R2 every time

tailscale:
  tags:
    - "tag:outpost"               # must match the auth key's tag

r2:
  account_id: "your-account-id"
