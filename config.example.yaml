# Outpost configuration.
#
# Secrets are NOT here. They come from the environment:
#   HETZNER_TOKEN, CF_TOKEN, TS_AUTHKEY, R2_ACCESS_KEY, R2_SECRET_KEY,
#   OUTPOST_TOKEN (optional, bearer token for the HTTP API)
#
# Deployed, this file lives at data/config.yaml beside the database and packs/,
# which is the container's working directory, so the relative paths below are
# correct as written. Copy config.example.yaml to data/config.yaml and edit.
#
# For local work, `outpost` reads ./config.yaml from wherever you run it.
#
# The paths are relative to the working directory on purpose: `pack fetch` from a
# laptop writes to ./pack, the daemon writes to ./packs, and both are "here".

# Loopback on purpose for a bare run (`outpost serve` from a checkout). The
# container overrides this with `serve --listen 0.0.0.0:8896`, because docker
# forwards the published port to the container's interface; there, compose's
# `127.0.0.1:8896:8896` mapping is what keeps it off the network.
listen: "127.0.0.1:8896"
database: "outpost.db"

# Where the host update watcher and this daemon exchange update requests and
# answers (internal/updatesignal): the daemon writes `requested`, the watcher
# writes `available.json`, `result` and `heartbeat`. Compose mounts it, so the
# deployed value is /update-signal. Empty means "no watcher installed" — a binary
# built from a checkout and run by hand — and the page then hides the Update
# button rather than writing a request nobody reads. Leave it empty for local work.
update_signal_dir: "/update-signal"

server:
  asset_bucket: "mc-assets"   # mods, fabric jar, server.properties, scripts
  world_bucket: "mc-worlds"   # current/world.tar.gz + timestamped backups
  mc_port: 25565

  # Where pack directories are kept while they are being fetched or installed,
  # one per profile plus a .mrpack cache. `outpost pack fetch` and the Modpack
  # panel both write here; relative to the daemon's working directory, which in
  # the container is /data — so this is the bind-mounted data folder, and the
  # panel's downloads survive a container being recreated.
  pack_dir: "packs"

  # Total time billed after the last player logs off is idle_grace + idle_timeout.
  idle_grace: "10m"           # empty -> IDLE
  idle_timeout: "20m"         # IDLE -> TERMINATING
  provision_timeout: "15m"    # give up on a VPS that never answers RCON
  tick_interval: "20s"
  rcon_failure_limit: 15      # consecutive failed probes before a live server
                              #   is assumed wedged and taken down. 15 x 20s = 5
                              #   minutes: enough for a tailnet reconnect.

# Every key here is a valid `outpost start <region>` argument.
#
# `server_type` is the plan this region rents *by default*. It is not the menu:
# `internal/hetzner/plans.go` holds the sizes, vCPU, RAM and EUR/hour for the CX
# and CAX lines, the page offers a picker built from that table, and the choice
# is remembered across sessions. The price therefore comes from the plan, not
# from this file — there is one table, so the readout and the RAM guard cannot
# disagree.
#
# Fallbacks are not sizes you can choose. They are what to try when the chosen
# plan is *sold out*: Hetzner answers with 412 resource_unavailable rather than
# queueing, so without a list one missing size means no session at all. Keep them
# at least as big as server_type, or a sold-out rental lands on a box too small
# for the pack.
regions:
  eu:
    location: nbg1            # Nuremberg
    server_type: cx23         # 2 vCPU, 4 GB  (see internal/hetzner/plans.go)
    # Tried in order when the chosen plan has no capacity at this location.
    fallback_types:
      - cx33                  # 4 vCPU, 8 GB
      - cax11                 # 2 vCPU, 4 GB, ARM

cloudflare:
  zone_id: "your-zone-id"
  record_name: "mc.example.com"   # DNS-only A record, updated on start

hetzner:
  image: "ubuntu-24.04"
  ssh_key_id: 12345               # from the Hetzner console
  ssh_private_key: "~/.ssh/outpost"
  ssh_user: "root"
  server_name_base: "outpost"     # also the tailnet hostname prefix
  # firewall_id: 67890            # optional: an existing Hetzner Cloud Firewall,
                                  #   applied at create time. ufw in cloud-init
                                  #   is the floor; this is the belt.
  # snapshot_id: 67890            # optional: restore from a prepped snapshot
                                  # instead of building from R2 every time

tailscale:
  # Tags are opt-in. Leave this empty and the VPS joins as an ordinary device,
  # which always works. Set it only once `tag:outpost` exists in your tailnet's
  # ACLs with an owner — otherwise `tailscale up` refuses the join with
  # "requested tags are invalid or not permitted" and the VPS is unreachable.
  # tags:
  #   - "tag:outpost"

r2:
  account_id: "your-account-id"
